name: Refresh profile activity
on:
  schedule:
    - cron: '23 5 * * *'
  workflow_dispatch:
  push:
    paths:
      - scripts/activity.mjs
      - .github/workflows/activity.yml
permissions:
  contents: write
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - name: Generate activity panel
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/activity.mjs
      - name: Save activity panel
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/activity.svg
          if ! git diff --staged --quiet; then
            git commit -m "Refresh GitHub activity panel"
            git push
          fi

