<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="320" viewBox="0 0 1000 320" role="img" aria-labelledby="pantry-title pantry-desc">
  <title id="pantry-title">PantryPulse: animated freshness and dinner-planning preview</title>
  <desc id="pantry-desc">An illustrated fridge inventory becomes a quick garden skillet. Native Android app with AI fridge and receipt scans, ten languages including Tamil, and five animated themes.</desc>
  <defs>
    <linearGradient id="pantry-leaf" x1="35" y1="31" x2="74" y2="78" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#d0ff8e"/><stop offset="1" stop-color="#68d8ab"/></linearGradient>
    <linearGradient id="pantry-scan"><stop offset="0" stop-color="#b5f477" stop-opacity="0"/><stop offset=".5" stop-color="#b5f477"/><stop offset="1" stop-color="#68d8ab" stop-opacity="0"/></linearGradient>
  </defs>
  <style>
    text{font-family:Segoe UI,Arial,sans-serif}.mono{font-family:Consolas,monospace}
    @keyframes pantry-sweep{0%,100%{transform:translateY(0);opacity:.15}50%{transform:translateY(142px);opacity:.7}}
    @keyframes pantry-breathe{50%{opacity:.35}}
    @keyframes pantry-meal{0%,20%,100%{opacity:.6}40%,80%{opacity:1}}
    .sweep{animation:pantry-sweep 6s ease-in-out infinite}.breathe{animation:pantry-breathe 3s ease-in-out infinite}.meal{animation:pantry-meal 6s ease-in-out infinite}
    @media(prefers-reduced-motion:reduce){*{animation:none!important}.sweep{display:none}}
  </style>
  <rect x="1" y="1" width="998" height="318" rx="22" fill="#0c1222" stroke="#283450"/>
  <path d="M514 27V293" stroke="#283450"/>
  <text x="30" y="39" fill="#b5f477" font-size="12" class="mono" letter-spacing="2">03 / COOK WITH WHAT YOU HAVE</text>
  <text x="29" y="94" fill="#eef5ff" font-size="38" font-weight="700">PantryPulse</text>
  <g transform="translate(398 46) scale(.7)">
    <circle cx="54" cy="54" r="43" fill="#15271e" stroke="#68d8ab" stroke-opacity=".35"/>
    <circle cx="54" cy="54" r="49" fill="none" stroke="#b5f477" stroke-opacity=".3" class="breathe"/>
    <path d="M35 67C27 43 43 28 76 31C80 58 67 77 44 72L34 80L37 69Z" fill="url(#pantry-leaf)"/>
    <path d="M35 56H44L50 45L57 65L63 53H75" fill="none" stroke="#12231a" stroke-width="3.8" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="77" cy="35" r="2.3" fill="#ffcf86"/>
  </g>
  <text x="30" y="135" fill="#d5deee" font-size="17">Good food. Nothing wasted.</text>
  <text x="30" y="168" fill="#94a3b8" font-size="15">AI fridge scans • practical dinner plans</text>
  <text x="30" y="194" fill="#94a3b8" font-size="15">10 languages, including Tamil • 5 themes</text>
  <text x="30" y="257" fill="#60efff" font-size="12" class="mono">KOTLIN / JETPACK COMPOSE / SUPABASE</text>
  <text x="30" y="291" fill="#a78bfa" font-size="13" class="mono" letter-spacing="1">EXPLORE THE APP ↗</text>
  <text x="548" y="40" fill="#94a3b8" font-size="11" class="mono" letter-spacing="1">FRESHNESS PREVIEW · ILLUSTRATION</text>
  <rect x="548" y="70" width="405" height="42" rx="8" fill="#131e32"/>
  <circle cx="570" cy="91" r="11" fill="#ff9e85" fill-opacity=".15" stroke="#ff9e85"/>
  <circle cx="570" cy="91" r="6" fill="#ff9e85" class="breathe"/>
  <text x="594" y="96" fill="#d5deee" font-size="14">Baby spinach</text>
  <text x="935" y="95" fill="#ffb29f" font-size="11" text-anchor="end">Use today</text>
  <rect x="548" y="122" width="405" height="42" rx="8" fill="#131e32"/>
  <circle cx="570" cy="143" r="11" fill="#ffcf86" fill-opacity=".15" stroke="#ffcf86"/>
  <circle cx="570" cy="143" r="6" fill="#ffcf86" class="breathe" style="animation-delay:-1s"/>
  <text x="594" y="148" fill="#d5deee" font-size="14">Cherry tomatoes</text>
  <text x="935" y="147" fill="#ffcf86" font-size="11" text-anchor="end">Next 3 days</text>
  <rect x="548" y="174" width="405" height="42" rx="8" fill="#131e32"/>
  <circle cx="570" cy="195" r="11" fill="#68d8ab" fill-opacity=".15" stroke="#68d8ab"/>
  <circle cx="570" cy="195" r="6" fill="#68d8ab" class="breathe" style="animation-delay:-2s"/>
  <text x="594" y="200" fill="#d5deee" font-size="14">Bell pepper</text>
  <text x="935" y="199" fill="#91e6b4" font-size="11" text-anchor="end">Fresh</text>
  <rect x="548" y="70" width="405" height="2" fill="url(#pantry-scan)" class="sweep"/>
  <g class="meal">
    <rect x="548" y="237" width="405" height="46" rx="9" fill="#16291e" stroke="#68d8ab" stroke-opacity=".4"/>
    <text x="565" y="266" fill="#b5f477" font-size="25">✦</text>
    <text x="594" y="257" fill="#d6ffb2" font-size="14" font-weight="600">Quick garden skillet</text>
    <text x="594" y="274" fill="#a5c9b1" font-size="11">15 min · four simple steps</text>
  </g>
</svg>
